<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Redeem Hadiah - AeroMiles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../statics/navbar-components.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #eaf3f8; min-height: 100vh; }
    :root {
      --navy: #0d2137; --navy2: #163352;
      --teal: #3dbfbf; --teal-light: #5fd6d6;
      --muted: #6b8499;
    }

    /* HERO */
    .hero-strip {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
      padding: 2rem 2rem 3.5rem; position: relative; overflow: hidden;
    }
    .hero-strip::before {
      content:''; position:absolute; right:-60px; top:-60px;
      width:300px; height:300px; border-radius:50%;
      background:rgba(61,191,191,0.08);
    }
    .hero-inner { max-width:1280px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1; }
    .hero-title { color:white; font-size:1.6rem; font-weight:800; letter-spacing:-0.02em; }
    .hero-sub { color:rgba(255,255,255,0.5); font-size:0.82rem; margin-top:0.25rem; }
    .miles-pill {
      background:rgba(255,255,255,0.08); border:1px solid rgba(61,191,191,0.3);
      border-radius:16px; padding:1rem 1.5rem; text-align:right;
    }
    .miles-pill .label { font-size:0.7rem; color:rgba(255,255,255,0.5); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:4px; }
    .miles-pill .value { font-size:1.6rem; font-weight:800; color:var(--teal); }
    .miles-pill .unit { font-size:0.75rem; color:rgba(255,255,255,0.4); margin-top:2px; }

    /* CONTENT */
    .content { max-width:1280px; margin:-1.5rem auto 0; padding:0 2rem 3rem; position:relative; z-index:2; }

    /* TABS */
    .tabs-wrap {
      background:white; border-radius:16px 16px 0 0;
      padding:0 1.5rem; display:flex;
      border-bottom:1.5px solid #e8f0f5;
    }
    .tab-btn {
      background:none; border:none; cursor:pointer;
      font-family:inherit; font-size:0.82rem; font-weight:600;
      color:var(--muted); padding:1rem 1.25rem;
      border-bottom:2.5px solid transparent; margin-bottom:-1.5px;
      transition:all 0.18s;
    }
    .tab-btn.active { color:var(--navy); border-bottom-color:var(--teal); }
    .tab-btn:hover { color:var(--navy); }

    .panels-wrap { background:white; border-radius:0 0 16px 16px; padding:1.5rem; }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    /* GRID */
    .katalog-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px,1fr)); gap:1rem; }

    /* CARD */
    .hadiah-card {
      border-radius:16px; overflow:hidden; border:1.5px solid #e8f0f5;
      transition:all 0.22s; display:flex; flex-direction:column;
    }
    .hadiah-card:hover { border-color:var(--teal); transform:translateY(-3px); box-shadow:0 16px 40px rgba(13,33,55,0.1); }
    .card-header { background:var(--navy); padding:1.1rem 1.25rem; display:flex; justify-content:space-between; align-items:flex-start; }
    .card-kode { font-size:0.68rem; font-weight:700; color:var(--teal); letter-spacing:0.08em; background:rgba(61,191,191,0.15); border:1px solid rgba(61,191,191,0.3); padding:0.2rem 0.6rem; border-radius:6px; }
    .card-penyedia { font-size:0.7rem; color:rgba(255,255,255,0.45); text-align:right; }
    .card-body { padding:1.1rem 1.25rem; flex:1; display:flex; flex-direction:column; }
    .card-nama { font-size:0.95rem; font-weight:700; color:var(--navy); margin-bottom:0.4rem; }
    .card-desc { font-size:0.78rem; color:var(--muted); line-height:1.55; flex:1; }
    .card-periode { font-size:0.7rem; color:#aabbc8; margin-top:0.6rem; }
    .card-footer { padding:0.9rem 1.25rem; background:#f7fafc; display:flex; justify-content:space-between; align-items:center; border-top:1px solid #eef3f7; }
    .miles-cost { font-size:1.1rem; font-weight:800; color:var(--navy); }
    .miles-cost small { display:block; font-size:0.68rem; font-weight:400; color:var(--muted); }
    .not-enough { font-size:0.68rem; color:#e05252; margin-top:2px; }
    .btn-redeem { background:var(--teal); color:white; border:none; padding:0.5rem 1.2rem; border-radius:10px; cursor:pointer; font-family:inherit; font-size:0.75rem; font-weight:700; letter-spacing:0.05em; transition:all 0.18s; }
    .btn-redeem:hover { background:var(--teal-light); transform:scale(1.04); }
    .btn-redeem:disabled { background:#d0dde6; color:#9ab0c0; cursor:not-allowed; transform:none; }

    /* RIWAYAT */
    .riwayat-wrap { border-radius:12px; overflow:hidden; border:1.5px solid #e8f0f5; }
    table { width:100%; border-collapse:collapse; }
    thead { background:var(--navy); }
    th { color:rgba(255,255,255,0.6); font-size:0.72rem; font-weight:600; padding:0.9rem 1.25rem; text-align:left; letter-spacing:0.06em; text-transform:uppercase; }
    td { padding:1rem 1.25rem; font-size:0.83rem; color:var(--navy); border-bottom:1px solid #f0f5f8; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#f7fbfd; }
    .miles-used { color:#e05252; font-weight:700; }
    .time-cell { color:var(--muted); font-size:0.78rem; }

    /* MODAL */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(13,33,55,0.65); backdrop-filter:blur(6px); z-index:100; align-items:center; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { background:white; border-radius:20px; width:420px; max-width:92vw; overflow:hidden; animation:popIn 0.25s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes popIn { from { opacity:0; transform:scale(0.92) translateY(16px); } to { opacity:1; transform:none; } }
    .modal-head { background:var(--navy); padding:1.5rem 1.75rem; }
    .modal-head h3 { color:white; font-size:1rem; font-weight:700; }
    .modal-head p { color:rgba(255,255,255,0.45); font-size:0.78rem; margin-top:3px; }
    .modal-body { padding:1.5rem 1.75rem; }
    .info-row { display:flex; justify-content:space-between; align-items:center; padding:0.6rem 0; border-bottom:1px solid #f0f5f8; font-size:0.83rem; }
    .info-row:last-child { border-bottom:none; }
    .info-label { color:var(--muted); }
    .info-val { font-weight:600; color:var(--navy); }
    .info-val.deduct { color:#e05252; }
    .modal-actions { display:flex; gap:0.75rem; padding:0 1.75rem 1.5rem; justify-content:flex-end; }
    .btn-batal { background:none; border:1.5px solid #d8e5ee; color:var(--muted); padding:0.6rem 1.25rem; border-radius:10px; cursor:pointer; font-family:inherit; font-size:0.82rem; font-weight:600; transition:all 0.18s; }
    .btn-batal:hover { border-color:#aabbc8; color:var(--navy); }
    .btn-konfirm { background:var(--teal); color:white; border:none; padding:0.6rem 1.5rem; border-radius:10px; cursor:pointer; font-family:inherit; font-size:0.82rem; font-weight:700; transition:all 0.18s; }
    .btn-konfirm:hover { background:var(--teal-light); }

    /* TOAST */
    .toast { position:fixed; bottom:2rem; right:2rem; z-index:200; background:var(--navy); color:white; padding:0.85rem 1.4rem; border-radius:12px; font-size:0.82rem; font-weight:500; border-left:3px solid var(--teal); display:flex; align-items:center; gap:0.6rem; transform:translateY(80px); opacity:0; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 8px 32px rgba(13,33,55,0.2); }
    .toast.show { transform:none; opacity:1; }
    .empty-state { text-align:center; padding:3rem 1rem; color:var(--muted); font-size:0.85rem; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<aero-navbar role="member" active="redeem-hadiah"></aero-navbar>

<!-- HERO -->
<div class="hero-strip">
  <div class="hero-inner">
    <div>
      <div class="hero-title">Redeem Hadiah</div>
      <div class="hero-sub">Tukarkan award miles Anda dengan hadiah eksklusif</div>
    </div>
    <div class="miles-pill">
      <div class="label">Award Miles Tersedia</div>
      <div class="value" id="miles-display">32,000</div>
      <div class="unit">miles</div>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="content">
  <div class="tabs-wrap">
    <button class="tab-btn active" onclick="switchTab('katalog', this)">✦ &nbsp;Katalog Hadiah</button>
    <button class="tab-btn" onclick="switchTab('riwayat', this)">↩ &nbsp;Riwayat Redeem</button>
  </div>
  <div class="panels-wrap">
    <div id="tab-katalog" class="tab-panel active">
      <div class="katalog-grid" id="katalog-grid"></div>
    </div>
    <div id="tab-riwayat" class="tab-panel">
      <div class="riwayat-wrap">
        <table>
          <thead><tr><th>Hadiah</th><th>Waktu Redeem</th><th>Miles Digunakan</th></tr></thead>
          <tbody id="riwayat-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Konfirmasi Penukaran</h3>
      <p>Pastikan detail berikut sudah benar sebelum melanjutkan</p>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn-batal" onclick="closeModal()">Batal</button>
      <button class="btn-konfirm" onclick="konfirmasiRedeem()">Konfirmasi Redeem</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span>✓</span><span id="toast-msg"></span></div>

<script>
  // DATA DUMMY — sesuai INSERT SQL yang sudah dibuat
  // PENYEDIA: id 1=Garuda, 2=Citilink, 3=Lion Air, 4=Sriwijaya, 5=Batik Air
  const penyedia = {
    1: 'Garuda Indonesia',
    2: 'Citilink Indonesia',
    3: 'Lion Air',
    4: 'Sriwijaya Air',
    5: 'Batik Air'
  };

  // Sesuai INSERT INTO HADIAH di insert_data.sql
  const hadiah = [
    { kode:'RWD-001', nama:'Free Ticket Domestik',       id_penyedia:1, miles:15000, desc:'Tiket gratis untuk rute domestik pilihan Anda tanpa biaya tambahan.',         start:'2025-01-01', end:'2026-06-30' },
    { kode:'RWD-002', nama:'Upgrade Business Class',      id_penyedia:2, miles:20000, desc:'Nikmati kursi business class yang lebih lega dari economy class Anda.',        start:'2025-03-01', end:'2027-03-01' },
    { kode:'RWD-003', nama:'Lounge Access',               id_penyedia:3, miles:5000,  desc:'Akses eksklusif ke airport lounge di seluruh bandara partner kami.',            start:'2024-07-01', end:'2026-12-31' },
    { kode:'RWD-004', nama:'Extra Baggage 20kg',          id_penyedia:4, miles:3000,  desc:'Tambahan bagasi 20kg untuk penerbangan berikutnya.',                            start:'2025-06-01', end:'2026-06-01' },
    { kode:'RWD-005', nama:'Hotel Voucher Bintang 4',     id_penyedia:5, miles:25000, desc:'Voucher menginap 1 malam di hotel bintang 4 partner kami.',                     start:'2026-01-01', end:'2027-01-01' },
    { kode:'RWD-006', nama:'Free Ticket Internasional',   id_penyedia:1, miles:40000, desc:'Tiket gratis untuk rute internasional ke destinasi pilihan.',                   start:'2025-01-01', end:'2027-12-31' },
    { kode:'RWD-007', nama:'Airport Transfer',            id_penyedia:2, miles:2000,  desc:'Layanan antar jemput bandara ke hotel atau sebaliknya.',                        start:'2026-04-01', end:'2026-10-31' },
    { kode:'RWD-008', nama:'Diskon 50% Tiket',            id_penyedia:3, miles:8000,  desc:'Diskon 50% untuk pembelian 1 tiket penerbangan pilihan.',                       start:'2025-09-01', end:'2026-09-01' },
    { kode:'RWD-009', nama:'Priority Check-in',           id_penyedia:4, miles:1500,  desc:'Layanan priority check-in dan boarding di semua penerbangan.',                  start:'2024-11-01', end:'2026-04-30' },
    { kode:'RWD-010', nama:'Free Meal Voucher',           id_penyedia:5, miles:1000,  desc:'Voucher makan gratis di restoran partner di area bandara.',                     start:'2026-03-01', end:'2026-08-31' },
  ];

  // Data dummy riwayat sesuai tabel REDEEM di database  (soon)
  let riwayat = [
    { nama:'Lounge Access', timestamp:'2025-01-20 16:00', miles:5000 },
  ];

  let awardMiles = 32000; // Sesuai award_miles member dummy
  let selected = null;
  const today = new Date();

  function isValid(h) {
    return today >= new Date(h.start) && today <= new Date(h.end);
  }

  function renderKatalog() {
    const grid = document.getElementById('katalog-grid');
    const valid = hadiah.filter(isValid);
    if (!valid.length) {
      grid.innerHTML = '<div class="empty-state">Belum ada hadiah tersedia saat ini.</div>';
      return;
    }
    grid.innerHTML = valid.map(h => {
      const cukup = awardMiles >= h.miles;
      return `
        <div class="hadiah-card">
          <div class="card-header">
            <span class="card-kode">${h.kode}</span>
            <span class="card-penyedia">${penyedia[h.id_penyedia]}</span>
          </div>
          <div class="card-body">
            <div class="card-nama">${h.nama}</div>
            <div class="card-desc">${h.desc}</div>
            <div class="card-periode">📅 ${h.start} — ${h.end}</div>
          </div>
          <div class="card-footer">
            <div>
              <div class="miles-cost">${h.miles.toLocaleString('id-ID')} <small>miles dibutuhkan</small></div>
              ${!cukup ? '<div class="not-enough">Miles tidak mencukupi</div>' : ''}
            </div>
            <button class="btn-redeem" onclick="openModal('${h.kode}')" ${!cukup?'disabled':''}>REDEEM</button>
          </div>
        </div>`;
    }).join('');
  }

  function renderRiwayat() {
    const tbody = document.getElementById('riwayat-body');
    if (!riwayat.length) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:2.5rem;color:#aabbc8;">Belum ada riwayat redeem.</td></tr>';
      return;
    }
    tbody.innerHTML = riwayat.map(r => `
      <tr>
        <td><strong>${r.nama}</strong></td>
        <td class="time-cell">${r.timestamp}</td>
        <td class="miles-used">−${r.miles.toLocaleString('id-ID')}</td>
      </tr>`).join('');
  }

  function openModal(kode) {
    selected = hadiah.find(h => h.kode === kode);
    if (!selected) return;
    document.getElementById('modal-body').innerHTML = `
      <div class="info-row"><span class="info-label">Hadiah</span><span class="info-val">${selected.nama}</span></div>
      <div class="info-row"><span class="info-label">Penyedia</span><span class="info-val">${penyedia[selected.id_penyedia]}</span></div>
      <div class="info-row"><span class="info-label">Kode</span><span class="info-val">${selected.kode}</span></div>
      <div class="info-row"><span class="info-label">Miles dipotong</span><span class="info-val deduct">−${selected.miles.toLocaleString('id-ID')} miles</span></div>
      <div class="info-row"><span class="info-label">Sisa miles</span><span class="info-val">${(awardMiles - selected.miles).toLocaleString('id-ID')} miles</span></div>
    `;
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    selected = null;
  }

  function konfirmasiRedeem() {
    if (!selected || awardMiles < selected.miles) return;
    awardMiles -= selected.miles;
    const now = new Date().toISOString().replace('T',' ').slice(0,16);
    riwayat.unshift({ nama: selected.nama, timestamp: now, miles: selected.miles });
    document.getElementById('miles-display').textContent = awardMiles.toLocaleString('id-ID');
    closeModal(); renderKatalog(); renderRiwayat();
    showToast('Redeem ' + selected.nama + ' berhasil!');
  }

  function switchTab(tab, btn) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    btn.classList.add('active');
  }

  function showToast(msg) {
    document.getElementById('toast-msg').textContent = msg;
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);
  }

  renderKatalog(); renderRiwayat();
</script>
</body>
</html>
