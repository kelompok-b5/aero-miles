{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Info Tier - AeroMiles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.AERO_USER = {
      nama: "{{ request.session.nama }}",
      singkatan: "{{ request.session.singkatan }}",
      sub: "{{ request.session.nama_tier }} · {{ request.session.nomor_member }}"
    };
  </script>
  <script src="{% static 'navbar-components.js' %}" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #eaf3f8; min-height: 100vh; }
    :root { --navy: #0d2137; --navy2: #163352; --teal: #3dbfbf; --teal-light: #5fd6d6; --muted: #6b8499; }

    
    .hero-strip {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
      padding: 2rem 2rem 3.5rem; position: relative; overflow: hidden;
    }
    .hero-strip::before {
      content:''; position:absolute; right:-60px; top:-60px;
      width:300px; height:300px; border-radius:50%; background:rgba(61,191,191,0.08);
    }
    .hero-inner { max-width:1280px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1; }
    .hero-title { color:white; font-size:1.6rem; font-weight:800; letter-spacing:-0.02em; }
    .hero-sub { color:rgba(255,255,255,0.5); font-size:0.82rem; margin-top:0.25rem; }
    .miles-pill { background:rgba(255,255,255,0.08); border:1px solid rgba(61,191,191,0.3); border-radius:16px; padding:1rem 1.5rem; text-align:right; }
    .miles-pill .label { font-size:0.7rem; color:rgba(255,255,255,0.5); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:4px; }
    .miles-pill .value { font-size:1.6rem; font-weight:800; color:var(--teal); }
    .miles-pill .unit { font-size:0.75rem; color:rgba(255,255,255,0.4); margin-top:2px; }

    .content { max-width:1100px; margin:-1.5rem auto 0; padding:0 2rem 3rem; position:relative; z-index:2; }

    /* PROGRESS CARD */
    .progress-card { background:white; border-radius:16px; padding:1.5rem 1.75rem; border:1.5px solid #e8f0f5; margin-bottom:1.25rem; }
    .progress-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem; }
    .progress-heading { font-size:1.1rem; font-weight:800; color:var(--navy); }
    .progress-sub { font-size:0.88rem; color:var(--muted); margin-top:4px; }
    .progress-nums { font-size:0.9rem; color:var(--muted); text-align:right; }
    .progress-nums strong { color:var(--navy); font-size:1.2rem; }

    .progress-bar-wrap { position:relative; margin-bottom:0.5rem; }
    .progress-bar-bg { background:#e8f0f5; border-radius:99px; height:10px; overflow:visible; position:relative; }
    .progress-bar-fill { background:linear-gradient(90deg, var(--teal), var(--teal-light)); height:100%; border-radius:99px; position:relative; transition:width 0.8s ease; }
    .plane-marker {
        position:absolute; right:-20px; top:50%; transform:translateY(-50%);
        font-size:1.8rem; line-height:1; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15));
    }
    .progress-note { font-size:0.75rem; color:var(--muted); margin-top:0.5rem; }
    .progress-note span { color:var(--teal); font-weight:700; }

    /* TIER GRID */
    .tier-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:1rem; }

    .tier-card {
      background:white; border-radius:16px; border:1.5px solid #e8f0f5;
      display:flex; flex-direction:column; overflow:hidden;
      transition:all 0.22s;
    }
    .tier-card:hover { transform:translateY(-3px); box-shadow:0 12px 32px rgba(13,33,55,0.1); }
    .tier-card.active { border-color:var(--teal); box-shadow:0 8px 32px rgba(61,191,191,0.18); }

    .tier-card-header {
      padding:1.5rem 1.25rem 1rem;
      display:flex; flex-direction:column; align-items:center;
      border-bottom:1.5px solid #f0f5f8; text-align:center;
    }
    .tier-icon-circle {
      width:56px; height:56px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:1.5rem; margin-bottom:0.85rem;
    }
    .tier-icon-circle.diamond    { background:#dceef8; }
    .tier-icon-circle.silver   { background:#ebebeb; }
    .tier-icon-circle.gold     { background:#fef0cc; }
    .tier-icon-circle.platinum { background:#ede8f5; }

    .tier-name { font-size:1rem; font-weight:800; color:var(--navy); letter-spacing:0.04em; text-transform:uppercase; }
    .tier-active-badge {
      margin-top:0.4rem; background:var(--teal); color:white;
      font-size:0.62rem; font-weight:700; padding:0.15rem 0.6rem;
      border-radius:99px; letter-spacing:0.05em;
    }
    .tier-reqs {
      margin-top:0.5rem; font-size:0.72rem; color:var(--muted); line-height:1.6;
    }
    .tier-reqs span { color:var(--navy); font-weight:600; }

    .tier-divider {
      width:40px; height:3px; border-radius:99px; margin:0.75rem auto 0;
    }
    .tier-divider.diamond  { background:#4fc3f7; }
    .tier-divider.silver   { background:#b0bec5; }
    .tier-divider.gold     { background:#f9a825; }
    .tier-divider.platinum { background:#9c6bcc; }

    /* BENEFITS */
    .tier-benefits { padding:1.1rem 1.25rem; flex:1; display:flex; flex-direction:column; gap:0.85rem; }
    .benefit-item { display:flex; align-items:flex-start; gap:0.6rem; }
    .benefit-check { color:var(--teal); font-size:0.9rem; flex-shrink:0; margin-top:1px; }
    .benefit-text { font-size:0.78rem; color:var(--navy); font-weight:600; line-height:1.4; }
    .benefit-sub { font-size:0.7rem; color:var(--muted); font-weight:400; margin-top:1px; }

  </style>
</head>
<body>

<!-- NAVBAR -->
<aero-navbar role="member" active="info-tier"></aero-navbar>

<div class="hero-strip">
  <div class="hero-inner">
    <div>
      <div class="hero-title">Informasi Tier</div>
      <div class="hero-sub">Pantau posisi tier Anda dan syarat naik ke tier berikutnya</div>
    </div>
    <div class="miles-pill">
      <div class="label">Total Miles</div>
      <div class="value" id="total-miles-display">80,000</div>
      <div class="unit">miles</div>
    </div>
  </div>
</div>

<div class="content">
  <div class="progress-card" id="progress-card"></div>
  <div class="tier-grid" id="tier-grid"></div>
</div>

<script>
  console.log('raw:', '{{ tiers_json|escapejs }}');
  const tiersFromDB = JSON.parse('{{ tiers_json|escapejs }}');

  // Benefits tetap hardcode karena tidak ada di database
  const benefitsMap = {
    'T001': [
      { title:'Akumulasi Miles', sub:'Kumpulkan miles di setiap penerbangan.' },
      { title:'Akses Penawaran Member', sub:'Dapatkan penawaran eksklusif khusus member.' },
    ],
    'T002': [
      { title:'Semua benefit Silver', sub:'Nikmati seluruh keuntungan tier sebelumnya.' },
      { title:'Bonus Miles 25%', sub:'Dapatkan 25% ekstra miles di setiap penerbangan.' },
      { title:'Priority Check-in', sub:'Antrean check-in khusus di semua bandara partner.' },
    ],
    'T003': [
      { title:'Semua benefit Gold', sub:'Nikmati seluruh keuntungan tier sebelumnya.' },
      { title:'Bonus Miles 50%', sub:'Dapatkan 50% ekstra miles di setiap penerbangan.' },
      { title:'Priority Boarding', sub:'Boarding lebih awal di semua penerbangan.' },
      { title:'Akses Lounge Premium', sub:'Masuk lounge eksklusif di bandara partner.' },
      { title:'Extra Bagasi 10kg', sub:'Tambahan bagasi gratis di setiap penerbangan.' },
    ],
    'T004': [
      { title:'Semua benefit Platinum', sub:'Nikmati seluruh keuntungan tier sebelumnya.' },
      { title:'Bonus Miles 100%', sub:'Gandakan miles di setiap penerbangan Anda.' },
      { title:'Upgrade Gratis', sub:'Upgrade kelas kabin gratis sesuai ketersediaan.' },
      { title:'Akses First Class Lounge', sub:'Lounge eksklusif first class di seluruh dunia.' },
      { title:'Extra Bagasi 20kg', sub:'Tambahan bagasi 20kg di setiap penerbangan.' },
      { title:'Dedicated Hotline', sub:'Layanan pelanggan prioritas 24/7.' },
    ],
  };

  const iconMap  = { Silver:'⚪', Gold:'🟡', Platinum:'🟣', Diamond:'🔵' };
  const iconClass = { Silver:'silver', Gold:'gold', Platinum:'platinum', Diamond:'diamond' };

  // Gabungkan data DB dengan benefits & icon
  const tiers = tiersFromDB.map(t => ({
    ...t,
    icon: iconMap[t.nama] || '⭐',
    benefits: benefitsMap[t.id_tier] || [],
  }));

  const member = {
    total_miles: parseInt("{{ total_miles }}"),
    id_tier: "{{ id_tier_sekarang }}",
  };

  function renderProgress() {
    const currentIdx = tiers.findIndex(t => t.id_tier === member.id_tier);
    const next = tiers[currentIdx + 1];
    const card = document.getElementById('progress-card');

    if (!next) {
      card.innerHTML = `
        <div class="progress-top">
          <div>
            <div class="progress-heading">🏆 Anda sudah di tier tertinggi!</div>
            <div class="progress-sub">Selamat, Anda adalah member ${tiers[currentIdx].nama}.</div>
          </div>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:100%"><span class="plane-marker">✈️</span></div></div>
      `;
      return;
    }

    const pct = Math.min((member.total_miles / next.minimal_tier_miles) * 100, 100).toFixed(1);
    const milesLeft = next.minimal_tier_miles - member.total_miles;

    card.innerHTML = `
      <div class="progress-top">
        <div>
          <div class="progress-heading">Progress ke Tier Berikutnya: ${next.nama}</div>
          <div class="progress-sub">Butuh <strong style="color:var(--teal)">${milesLeft.toLocaleString('id-ID')} miles</strong> lagi untuk naik tier</div>
        </div>
        <div class="progress-nums">
          <strong>${member.total_miles.toLocaleString('id-ID')}</strong> / ${next.minimal_tier_miles.toLocaleString('id-ID')} miles
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width:${pct}%">
            <span class="plane-marker">✈️</span>
          </div>
        </div>
      </div>
    `;
  }

  function renderTiers() {
    const grid = document.getElementById('tier-grid');
    grid.innerHTML = tiers.map(t => {
      const isActive = t.id_tier === member.id_tier;
      const cls = iconClass[t.nama] || 'silver';
      return `
        <div class="tier-card ${isActive ? 'active' : ''}">
          <div class="tier-card-header">
            <div class="tier-icon-circle ${cls}">${t.icon}</div>
            <div class="tier-name">${t.nama}</div>
            ${isActive ? '<div class="tier-active-badge">Tier Anda</div>' : ''}
            <div class="tier-divider ${cls}"></div>
            <div class="tier-reqs">
              Min. <span>${t.minimal_frekuensi_terbang}</span> penerbangan<br>
              Min. <span>${t.minimal_tier_miles.toLocaleString('id-ID')}</span> miles
            </div>
          </div>
          <div class="tier-benefits">
            ${t.benefits.map(b => `
              <div class="benefit-item">
                <span class="benefit-check">✓</span>
                <div>
                  <div class="benefit-text">${b.title}</div>
                  <div class="benefit-sub">${b.sub}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('total-miles-display').textContent = member.total_miles.toLocaleString('id-ID');
  renderProgress();
  renderTiers();
</script>
</body>
</html>
