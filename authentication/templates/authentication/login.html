{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - AeroMiles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{% static 'navbar-components.js' %}" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #eaf3f8; min-height: 100vh; display: flex; flex-direction: column; }
    :root {
      --navy: #0d2137; --navy2: #163352;
      --teal: #3dbfbf; --teal-light: #5fd6d6;
      --muted: #6b8499;
    }

    /* MAIN */
    .main-wrapper {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 2rem; position: relative; overflow: hidden;
    }
    .main-wrapper::before {
      content:''; position:absolute; right:-120px; top:-120px;
      width:500px; height:500px; border-radius:50%;
      background: radial-gradient(circle, rgba(61,191,191,0.07) 0%, transparent 70%);
    }
    .main-wrapper::after {
      content:''; position:absolute; left:-80px; bottom:-80px;
      width:400px; height:400px; border-radius:50%;
      background: radial-gradient(circle, rgba(13,33,55,0.08) 0%, transparent 70%);
    }

    /* CARD */
    .auth-card {
      background: white; border-radius: 24px; width: 100%; max-width: 480px;
      box-shadow: 0 24px 80px rgba(13,33,55,0.12); overflow: hidden;
      position: relative; z-index: 2;
      animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }

    .card-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
      padding: 2rem 2rem 1.5rem; position: relative; overflow: hidden;
    }
    .card-header::before {
      content:''; position:absolute; right:-40px; top:-40px;
      width:160px; height:160px; border-radius:50%;
      background: rgba(61,191,191,0.08);
    }
    .header-icon {
      width: 48px; height: 48px; background: var(--teal); border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; margin-bottom: 1rem; position: relative; z-index: 1;
    }
    .header-title { color: white; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; position: relative; z-index: 1; }
    .header-sub { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 4px; position: relative; z-index: 1; }

    /* PANEL */
    .panel { padding: 1.75rem 2rem 2rem; }

    /* FORM */
    .form-group { margin-bottom: 1.1rem; }
    .form-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--navy); margin-bottom: 0.45rem; letter-spacing: 0.02em; }
    .form-label .req { color: #e05252; margin-left: 2px; }
    .form-input {
      width: 100%; padding: 0.65rem 0.9rem; border: 1.5px solid #d8e5ee;
      border-radius: 10px; font-size: 0.85rem; font-family: inherit;
      color: var(--navy); background: white; transition: all 0.18s;
      outline: none;
    }
    .form-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(61,191,191,0.12); }
    .form-input.error { border-color: #e05252; box-shadow: 0 0 0 3px rgba(224,82,82,0.1); }
    .form-input::placeholder { color: #a0b4c0; }

    /* BTN */
    .btn-submit {
      width: 100%; padding: 0.8rem; background: var(--teal); color: white;
      border: none; border-radius: 12px; font-size: 0.88rem; font-weight: 700;
      font-family: inherit; cursor: pointer; transition: all 0.18s;
      letter-spacing: 0.02em; margin-top: 0.5rem;
    }
    .btn-submit:hover { background: var(--teal-light); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(61,191,191,0.3); }
    .btn-submit:active { transform: none; }

    /* ERROR MSG */
    .error-msg { font-size: 0.74rem; color: #e05252; margin-top: 0.35rem; display: none; }
    .error-msg.show { display: block; }

    /* ALERT */
    .alert { padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.8rem; font-weight: 500; margin-bottom: 1.1rem; display: none; }
    .alert.show { display: flex; align-items: center; gap: 0.5rem; }
    .alert-error { background: #fff5f5; border: 1.5px solid #fdd; color: #c0392b; }

    /* FOOTER LINK */
    .card-footer-link { text-align: center; margin-top: 1rem; font-size: 0.8rem; color: var(--muted); }
    .card-footer-link a { color: var(--teal); font-weight: 600; text-decoration: none; }
    .card-footer-link a:hover { text-decoration: underline; }

    /* TOAST */
    .toast { position:fixed; bottom:2rem; right:2rem; z-index:200; background:var(--navy); color:white; padding:0.85rem 1.4rem; border-radius:12px; font-size:0.82rem; font-weight:500; border-left:3px solid var(--teal); display:flex; align-items:center; gap:0.6rem; transform:translateY(80px); opacity:0; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 8px 32px rgba(13,33,55,0.2); }
    .toast.show { transform:none; opacity:1; }

    @media (max-width: 520px) {
      .auth-card { border-radius: 20px; }
      .panel { padding: 1.5rem 1.5rem 1.75rem; }
      .card-header { padding: 1.5rem 1.5rem 1.25rem; }
    }
  </style>
</head>
<body>
<form style="display:none">{% csrf_token %}</form>

<!-- NAVBAR -->
<aero-navbar role="guest"></aero-navbar>

<!-- MAIN -->
<div class="main-wrapper">
  <div class="auth-card">

    <!-- HEADER -->
    <div class="card-header">
      <div class="header-icon">✈</div>
      <div class="header-title">Selamat Datang</div>
      <div class="header-sub">Masuk ke akun AeroMiles Anda</div>
    </div>

    <!-- LOGIN PANEL -->
    <div class="panel">
      <div class="alert alert-error" id="login-alert">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12" y2="16"/></svg>
        <span id="login-alert-msg"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Email <span class="req">*</span></label>
        <input type="email" class="form-input" id="login-email" placeholder="email@example.com"/>
        <div class="error-msg" id="err-login-email">Email tidak valid.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Password <span class="req">*</span></label>
        <input type="password" class="form-input" id="login-password" placeholder="••••••••"/>
        <div class="error-msg" id="err-login-pass">Password harus diisi.</div>
      </div>
      <button class="btn-submit" onclick="doLogin()">Log In</button>

      <div class="card-footer-link">
        Belum punya akun? <a href="{% url 'authentication:register' %}">Daftar di sini</a>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"><span>✓</span><span id="toast-msg"></span></div>

<script>
  function hideAlerts() {
    document.querySelectorAll('.alert').forEach(a => a.classList.remove('show'));
    document.querySelectorAll('.error-msg').forEach(e => e.classList.remove('show'));
    document.querySelectorAll('.form-input').forEach(i => i.classList.remove('error'));
  }

  function showAlert(id, msg) {
    const el = document.getElementById(id);
    document.getElementById(id + '-msg').textContent = msg;
    el.classList.add('show');
  }

  function fieldError(inputId, errId, msg) {
    document.getElementById(inputId).classList.add('error');
    const err = document.getElementById(errId);
    err.textContent = msg;
    err.classList.add('show');
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function doLogin() {
    hideAlerts();
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-password').value;
    let ok = true;

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      fieldError('login-email', 'err-login-email', 'Masukkan email yang valid.'); ok = false;
    }
    if (!pass) {
      fieldError('login-password', 'err-login-pass', 'Password harus diisi.'); ok = false;
    }
    if (!ok) return;

    fetch('/auth/login/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
      body: JSON.stringify({ email, password: pass })
    })
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        showAlert('login-alert', data.error);
      } else {
        showToast('Login berhasil! Mengalihkan...');
        setTimeout(() => window.location.href = data.redirect, 1200);
      }
    })
    .catch(() => showAlert('login-alert', 'Terjadi kesalahan, coba lagi.'));
  }

  function showToast(msg) {
    document.getElementById('toast-msg').textContent = msg;
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
